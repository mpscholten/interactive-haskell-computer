name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    # Apple Silicon is MANDATORY — the runtime emits aarch64 machine code and
    # MAP_JIT pages require Apple Silicon semantics; x86_64 cannot run the output.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Cabal update
        run: nix develop --command cabal update

      - name: Build
        run: nix develop --command cabal build all

      - name: Sign test binary (JIT entitlement required on macOS)
        run: nix develop --command make sign-test

      - name: Test
        run: |
          nix develop --command cabal test ihc-test --test-show-details=streaming \
            2>&1 | tee /tmp/ihc-test.log; exit ${PIPESTATUS[0]}

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/ihc-test.log
          retention-days: 7
